<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="メンチン（清一色）の何切ると待ちを無料でトレーニング。ランダム生成された14枚の手牌から、最善の打牌とすべての待ち牌を答える練習ができます。登録不要・スマホ対応。"
    />
    <title>メンチン何切る | 清一色の何切るを無料で特訓</title>
    <!-- 正規URL（旧ドメインからの移行中。ドメイン変更時は src/config/site.js のコメント参照） -->
    <link rel="canonical" href="https://zagakumahjong.com/chinitsu.html" />
    <!-- OGP（SNSでのリンクカード表示用） -->
    <meta property="og:title" content="メンチン何切る" />
    <meta property="og:description" content="メンチン（清一色）の何切るをトレーニング。間違えた問題を復習可能。登録不要・スマホ対応。" />
    <meta property="og:url" content="https://zagakumahjong.com/chinitsu.html" />
    <meta property="og:image" content="https://zagakumahjong.com/ogp.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      ドリル（#root）が描画されるまでのローディング表示。
      #root は空だと高さ0になり、その下に置いた説明テキスト（.chinitsu-about）が
      一瞬だけ画面の一番上に見えてしまう。それを塞ぐのがこのローディングの主目的で、
      高さは .boot-loading 自身の min-height で確保する。
      ※ #root 側に min-height を持たせてはいけない。マウント後も効き続けて、
        ドリルが 100vh に満たないぶんが説明テキストの上の空白として残ってしまう。
      App.css は本番では <link>、開発サーバーでは JS 経由で注入されるので、
      開発時も確実に効くようここにインラインで書いている（App.css には移さないこと）。
      React の createRoot().render() はマウント時に #root の子要素を削除するため、
      このローディングは JS 側で消す処理を書かなくても自動的に置き換わる。
    -->
    <!-- テーマの先読み（2026-11-04〜）。画面が描かれる前に <html data-theme> を付けて、ライト→ダークのちらつきを防ぐ。
         判定は src/utils/theme.js の resolveTheme と同じ（保存キー 'theme'。変えるときは両方そろえる） -->
    <script>
      (function () {
        var t = 'light';
        try {
          var p = localStorage.getItem('theme');
          t = p === 'light' || p === 'dark' ? p : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) { /* localStorage が使えなくてもライトで表示する */ }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      /* 色は index.css の --color-bg / --color-text-secondary / --color-border / --color-primary と同じ値
         （ライトとダーク）。配色を変えるときはここもそろえる */
      body { background: #fbfbfd; }
      html[data-theme="dark"] body { background: #121418; }
      .boot-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #596071;
        font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
        font-size: 0.9rem;
      }
      html[data-theme="dark"] .boot-loading { color: #a3aab7; }
      .boot-loading-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #e1e5ec;
        border-top-color: #2c4a85;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      html[data-theme="dark"] .boot-loading-spinner { border-color: #2c3039; border-top-color: #9db6ea; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading-spinner { animation-duration: 2.4s; }
      }
    </style>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VQYJXV1K4H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VQYJXV1K4H');
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading">
        <div class="boot-loading-spinner"></div>
        <p>読み込んでいます…</p>
      </div>
    </div>
    <!--
      検索エンジン向けの説明テキスト。ドリル本体は React（JS）描画のため、
      JSを実行しないクローラーが読めるテキストはここにしか無い。React側（chinitsu.jsx）に
      移すと意味が失われるので、React側へ移さないこと。
      ここに「例：（14桁の数字）」形式の牌姿を書いた場合は、chinitsuAboutHtml.test.js が
      本文を読んで判定エンジンと突き合わせ、和了形でないこと・記載した待ちが正しいことを自動検証する
      （手計算で確かめないこと。詳細は CLAUDE.md の「SEO（検索流入）の方針」）。
    -->
    <footer class="app-footer">
      <section class="chinitsu-about">
        <!-- 普段は畳んでおく（2026-11-04〜）。<details> なので閉じていても文章はHTMLに残り、検索エンジンにも読まれる -->
        <details>
        <summary><h2>メンチン何切るについて</h2></summary>
        <p>
          清一色（チンイツ、メンチン）は1種類の数牌だけで手を作るため、同じ14枚でも面子の取り方が何通りにも分かれます。
          順子と刻子のどちらに読むかで待ち牌が変わり、慣れないうちは待ちを取りこぼします。
        </p>
        <p>
          メンチン何切るは、清一色の手牌をランダムに生成し、切る牌と待ち牌をすべて答える形式でその読みを反復するものです。
          正解は受け入れ枚数が最大になる打牌で、同じ枚数なら打点が高くなる方を採ります。
          90秒で正答数を競うタイムアタックと、間違えた手牌だけを解き直す復習があり、登録不要・無料でスマートフォンからそのまま遊べます。
        </p>
        </details>
      </section>
      <!-- ご意見・ご要望はヘッダー右上へ移した（2026-11-04・chinitsu.jsx） -->
    </footer>
    <script type="module" src="/src/chinitsu.jsx"></script>
  </body>
</html>
