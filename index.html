  <body>
    <div id="root"></div>
    <!--
      検索エンジン向けのサイト説明。トップページの中身は React（JS）描画のため、
      JSを実行しないクローラーが読めるテキストはここにしか無い。React側（LandingPage.jsx）へ
      移すと意味が失われるので、整理や短縮の対象にしないこと。
      ドリル自体の詳しい説明は chinitsu.html 側にあるので、ここでは重複させず
      「サイト全体が何か」に絞って書く（詳細は CLAUDE.md の「SEO（検索流入）の方針」）。
      #root の外にあるので放っておくと出題画面にも出てしまう。トップ（ランディング・
      カテゴリ一覧）でだけ見せたいので、出題中は App.jsx の effect が hidden にしている。
    -->
    <section class="site-about">
      <h2>座学する麻雀について</h2>
      <p>
        麻雀の「何切る」は、手牌から1枚を選んで捨てる判断を問う問題。
        同じ牌姿でも巡目や点数状況で正解が変わるが、多くの場合で正解となる選択を無意識に取れるまで反復するのが上達の近道になる。
        このサイトは、その学習のためのもの。
      </p>
      <p>
        登録不要・無料で遊べるメンチン何切るドリルを公開している。
        清一色の手牌14枚から、切る牌とその後の待ち牌をすべて答える形式で、
        手牌は毎回その場で生成されるため出題が尽きない。
        90秒で正答数を競うタイムアタックと、間違えた手牌だけを解き直す復習機能も用意した。
      </p>
    </section>
    <script type="module" src="/src/main.jsx"></script>
