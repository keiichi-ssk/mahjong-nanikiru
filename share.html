<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 共有された1問を表示するページ。問題の中身は URL の ?p= に入っており、
         URLの数だけ中身の違うページが無限に生えるので検索対象にはしない
         （api/share-q.js の中継ページと同じ理由。robots.txt では塞がない——
         Twitterbot は robots.txt を尊重するため OGP カードが出なくなる）。 -->
    <meta name="robots" content="noindex, follow" />
    <title>共有された何切る | 座学する麻雀</title>
    <meta property="og:title" content="共有された何切る問題" />
    <meta property="og:description" content="麻雀の何切る問題。登録不要・スマホ対応。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Analytics 4（index.html / chinitsu.html と同じ測定ID）。
         このページの計測は「共有した問題が何回開かれたか」＝拡散の効き具合を見るためのもの -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VQYJXV1K4H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VQYJXV1K4H');
    </script>
    <!-- テーマの先読み（2026-11-04〜）。画面が描かれる前に <html data-theme> を付けて、ライト→ダークのちらつきを防ぐ。
         判定は src/utils/theme.js の resolveTheme と同じ（保存キー 'theme'。変えるときは両方そろえる） -->
    <script>
      (function () {
        var t = 'light';
        try {
          var p = localStorage.getItem('theme');
          t = p === 'light' || p === 'dark' ? p : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) { /* localStorage が使えなくてもライトで表示する */ }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <!-- #root は空だと高さ0になり、読み込み中に下の要素が画面最上部へ回り込む。
         高さは .boot-loading 自身の min-height で確保する（#root には付けないこと。
         マウント後も効き続けて余白が残る）。スタイルをここにインラインで書いているのは、
         開発サーバーでは CSS が JS 経由で注入され、App.css だと一瞬崩れるため。
         React の createRoot().render() がマウント時に中身を消すので、JSから消す処理は不要 -->
    <style>
      .boot-loading {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #596071;
        font-size: 0.9rem;
      }
      /* 色は index.css のトークンと同じ値（ライトとダーク）。配色を変えるときはここもそろえる */
      html[data-theme="dark"] .boot-loading { color: #a3aab7; }
      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e1e5ec;
        border-top-color: #2c4a85;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      html[data-theme="dark"] .boot-spinner { border-color: #2c3039; border-top-color: #9db6ea; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root">
      <div class="boot-loading">
        <div class="boot-spinner"></div>
        <div>読み込んでいます…</div>
      </div>
    </div>
    <script type="module" src="/src/share.jsx"></script>
  </body>
</html>
